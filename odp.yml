# This file (used in README.md) makes it easy to set up the PoC environment.

manifest:
  self:
    path: modules/lang/rust

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis      # required by the ARM port
          - cmsis_6    # required by the ARM port
          - hal_nxp    # required by NXP boards (e.g. mimxrt685_evk)
          - hal_nordic # required by the custom_plank board (Nordic based)
          - hal_rpi_pico # required by Raspberry Pi Pico boards
          - hal_stm32  # required by the nucleo_f302r8 board (STM32 based)
