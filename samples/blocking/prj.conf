CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048

# Sleeps round up to a whole tick, so the default 100 Hz would skew the printed timings.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_RUST=y

CONFIG_RUST_BLOCKING_POOL=y
CONFIG_RUST_BLOCKING_POOL_THREADS=2
CONFIG_RUST_BLOCKING_POOL_STACK_SIZE=1024
CONFIG_RUST_BLOCKING_POOL_PRIORITY=5
CONFIG_RUST_BLOCKING_POOL_SLOTS=2
CONFIG_RUST_BLOCKING_POOL_WAITERS=1
