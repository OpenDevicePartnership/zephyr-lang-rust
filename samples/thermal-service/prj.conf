# The default 1k stack isn't large enough for rust string formatting with logging.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_RUST=y

CONFIG_RUST_ALLOC=y
CONFIG_LOG=y

# RTT logging
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n

# RTT buffer configuration
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y

# Add sensor
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SENSOR_INIT_PRIORITY=90

# Stuff for UART
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_DMA_MCUX_LPC=y   
CONFIG_STDOUT_CONSOLE=n # u_Note: same as below, turning off the zephyr uart logging so it doesn't collide with our uart-service stuff
CONFIG_UART_CONSOLE=n # u_Note: turning off the zephyr uart logging so it doesn't collide with our uart-service stuff

# PWM Fan config
CONFIG_PWM=y
