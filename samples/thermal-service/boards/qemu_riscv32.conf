# No I2C needed for mock sensor on QEMU
CONFIG_I2C=n

# Match the tick rate that the thermal-service expects (default is 100, too slow)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Use icount with sleep=on so QEMU paces itself in real time
CONFIG_QEMU_ICOUNT_SLEEP=y
