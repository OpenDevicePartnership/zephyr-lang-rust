# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/blake/Repos/zephyr/zephyr-rust/zephyr/boards/nxp/mimxrt685_evk
  # Build outputs:
  elf_file: zephyr.elf
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/blake/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /home/blake/zephyr-sdk-1.0.1/hosttools/sysroots/aarch64-pokysdk-linux/usr/bin/openocd
  openocd_search:
    - /home/blake/zephyr-sdk-1.0.1/hosttools/sysroots/aarch64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MIMXRT685S:EVK-MIMXRT685
  jlink:
    - --dt-flash=y
    - --device=MIMXRT685S_M33
    - --reset-after-load
