# it51xxx_evb/it51526aw configuration for the zephyr-odp sample.

# The IT51XXX SoC never selects HAS_SEGGER_RTT, so log over the console UART instead.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_UART=y

# Console is uart2, the MCTP transport is uart1, so they do not collide here.
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# No DMA controller on this SoC.
CONFIG_DMA=n
CONFIG_DMA_MCUX_LPC=n

CONFIG_PWM=y
CONFIG_SENSOR=y

# The ITE RTC driver implements set/get time and alarms only.
CONFIG_RTC_UPDATE=n
CONFIG_RTC_CALIBRATION=n

# 128 KB of SRAM total, so trim the logging buffers.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_MAIN_STACK_SIZE=4096
